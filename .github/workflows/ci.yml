name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> ../target"

      - run: npm ci

      - name: Frontend
        run: |
          npm test
          npm run typecheck

      - name: Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast

      - name: Scripts
        run: |
          bash scripts/tests/notify.test.sh
          cargo build -p quacko-hook --manifest-path src-tauri/Cargo.toml
          QUACKO_NOTIFY="$CARGO_TARGET_DIR/debug/quacko-hook" bash scripts/tests/notify.test.sh
          bash scripts/tests/prwatch.test.sh
          bash scripts/tests/shell.test.sh
          pwsh -NoProfile -File scripts/tests/shell.test.ps1

  windows:
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> ../target"

      - run: npm ci

      - name: Hook (quacko-hook.exe, empacotado junto do app)
        run: |
          cargo build -p quacko-hook --manifest-path src-tauri/Cargo.toml
          mkdir -p src-tauri/binaries
          cp "$CARGO_TARGET_DIR/debug/quacko-hook.exe" src-tauri/binaries/quacko-hook-x86_64-pc-windows-msvc.exe

      - name: Frontend
        run: |
          npm test
          npm run typecheck

      - name: Rust
        working-directory: src-tauri
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast

      - name: Scripts
        run: |
          QUACKO_NOTIFY="$CARGO_TARGET_DIR/debug/quacko-hook.exe" bash scripts/tests/notify.test.sh
          pwsh -NoProfile -File scripts/tests/shell.test.ps1
