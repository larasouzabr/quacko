name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ vars.MACOS_SIGNING }}
        run: |
          if [ "$SIGNED" = true ]; then
            mac="macOS: build assinado e notarizado pela Apple."
          else
            mac="macOS: build sem assinatura da Apple. Na primeira abertura, use Ajustes do Sistema → Privacidade e Segurança → Abrir Mesmo Assim (instruções no README)."
          fi
          win="Windows: instalador sem certificado. Se o SmartScreen avisar, clique em Mais informações → Executar assim mesmo."
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id 2>/dev/null || true)
          case "$id" in "" | *[!0-9]*) id="" ;; esac
          if [ -n "$id" ]; then
            echo "usando a release que já existe para $GITHUB_REF_NAME"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Quacko $GITHUB_REF_NAME" \
              -f body="$mac"$'\n\n'"$win" -F draft=true --jq .id)
          fi
          case "$id" in "" | *[!0-9]*) id="" ;; esac
          if [ -z "$id" ]; then
            echo "::error::o GitHub não devolveu o id do rascunho"
            exit 1
          fi
          echo "rascunho $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  macos:
    needs: draft
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    runs-on: macos-latest
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> ../target"

      - run: npm ci

      - name: Testes
        run: |
          npm test
          npx tsc --noEmit
          cargo test --workspace --no-fail-fast --manifest-path src-tauri/Cargo.toml
          bash scripts/tests/notify.test.sh
          cargo build -p quacko-hook --manifest-path src-tauri/Cargo.toml
          QUACKO_NOTIFY="$CARGO_TARGET_DIR/debug/quacko-hook" bash scripts/tests/notify.test.sh
          bash scripts/tests/prwatch.test.sh
          bash scripts/tests/shell.test.sh
          pwsh -NoProfile -File scripts/tests/shell.test.ps1

      - name: Build e release (sem assinatura)
        if: github.event_name == 'push' && vars.MACOS_SIGNING != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUACKO_BUILD_GITHUB_CLIENT_ID: ${{ vars.QUACKO_GITHUB_CLIENT_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: --target universal-apple-darwin

      - name: Build e release (assinado e notarizado)
        if: github.event_name == 'push' && vars.MACOS_SIGNING == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUACKO_BUILD_GITHUB_CLIENT_ID: ${{ vars.QUACKO_GITHUB_CLIENT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: --target universal-apple-darwin

      - name: Cópia com nome fixo (botão de download do README)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          test -n "$RELEASE_ID" || { echo "::error::sem o id do rascunho"; exit 1; }
          file=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          curl -fsS -X POST -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$file" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=Quacko_universal.dmg"

      - name: Build (sem release)
        if: github.event_name != 'push'
        run: npx tauri build --target universal-apple-darwin

      - name: Guardar o .dmg
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quacko-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    needs: draft
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    runs-on: windows-latest
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> ../target"

      - run: npm ci

      - name: Hook (quacko-hook.exe, empacotado junto do app)
        run: |
          cargo build --release -p quacko-hook --manifest-path src-tauri/Cargo.toml
          mkdir -p src-tauri/binaries
          cp "$CARGO_TARGET_DIR/release/quacko-hook.exe" src-tauri/binaries/quacko-hook-x86_64-pc-windows-msvc.exe

      - name: Testes
        run: |
          npm test
          npx tsc --noEmit
          cargo test --workspace --no-fail-fast --manifest-path src-tauri/Cargo.toml
          QUACKO_NOTIFY="$CARGO_TARGET_DIR/release/quacko-hook.exe" bash scripts/tests/notify.test.sh
          pwsh -NoProfile -File scripts/tests/shell.test.ps1

      - name: Build e release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUACKO_BUILD_GITHUB_CLIENT_ID: ${{ vars.QUACKO_GITHUB_CLIENT_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}

      - name: Cópia com nome fixo (botão de download do README)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          test -n "$RELEASE_ID" || { echo "::error::sem o id do rascunho"; exit 1; }
          file=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          curl -fsS -X POST -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$file" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=Quacko_x64-setup.exe"

      - name: Build (sem release)
        if: github.event_name != 'push'
        run: npx tauri build

      - name: Guardar o instalador
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quacko-windows
          path: target/release/bundle/nsis/*.exe
