name: Release

# Cada merge na main que mexe no app vira uma versão nova: patch por padrão,
# minor ou major com o label de mesmo nome na PR. Os builds esperam aprovação
# no environment release e, quando os dois passam, a release é publicada.
# "Run workflow" continua gerando só os instaladores, sem release.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "!scripts/tests/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      version: ${{ steps.create.outputs.version }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/release

      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ vars.MACOS_SIGNING }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          releases=$(gh api "$repo/releases?per_page=100" --jq '.[] | "\(.id) \(.tag_name) \(.draft) \(.target_commitish)"')

          # Rodada repetida deste commit: reaproveita o rascunho dele.
          read -r id tag _ _ < <(awk -v sha="$GITHUB_SHA" '$4 == sha' <<<"$releases" | head -1) || true
          if [ -z "${id:-}" ]; then
            latest=$(gh api --paginate "$repo/tags?per_page=100" --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            labels=$(gh api "$repo/commits/$GITHUB_SHA/pulls" --jq '[.[0].labels[]?.name] | join(" ")' 2>/dev/null || true)
            tag="v$(bash .github/release/next-version.sh "${latest:-v0.0.0}" "$labels")"
            echo "última tag: ${latest:-nenhuma} · labels: ${labels:-nenhum} · nova: $tag"
            # Rascunho que sobrou de uma rodada que falhou: passa a apontar para este commit.
            read -r id _ draft _ < <(awk -v t="$tag" '$2 == t' <<<"$releases" | head -1) || true
            if [ -n "${id:-}" ] && [ "$draft" != true ]; then
              echo "::error::$tag já foi publicada, mas a tag não existe"
              exit 1
            fi
          fi

          if [ "$SIGNED" = true ]; then
            mac="macOS: build assinado e notarizado pela Apple."
          else
            mac="macOS: build sem assinatura da Apple. Na primeira abertura, use Ajustes do Sistema → Privacidade e Segurança → Abrir Mesmo Assim (instruções no README)."
          fi
          win="Windows: instalador sem certificado. Se o SmartScreen avisar, clique em Mais informações → Executar assim mesmo."

          if [ -n "${id:-}" ]; then
            echo "usando o rascunho $id de $tag"
            gh api -X PATCH "$repo/releases/$id" -f target_commitish="$GITHUB_SHA" --silent
          else
            id=$(gh api "$repo/releases" \
              -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="Quacko $tag" \
              -f body="$mac"$'\n\n'"$win" -F draft=true -F generate_release_notes=true --jq .id)
          fi
          case "$id" in "" | *[!0-9]*) echo "::error::o GitHub não devolveu o id do rascunho"; exit 1 ;; esac

          echo "rascunho $id para $tag"
          {
            echo "id=$id"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  macos:
    needs: draft
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    runs-on: macos-latest
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> ../target"

      - run: npm ci

      - name: Versão da release
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: node .github/release/set-version.mjs "$VERSION"

      - name: Testes
        run: |
          npm test
          npx tsc --noEmit
          cargo test --workspace --no-fail-fast --manifest-path src-tauri/Cargo.toml
          bash scripts/tests/notify.test.sh
          cargo build -p quacko-hook --manifest-path src-tauri/Cargo.toml
          QUACKO_NOTIFY="$CARGO_TARGET_DIR/debug/quacko-hook" bash scripts/tests/notify.test.sh
          bash scripts/tests/prwatch.test.sh
          bash scripts/tests/shell.test.sh
          pwsh -NoProfile -File scripts/tests/shell.test.ps1

      - name: Build e release (sem assinatura)
        if: github.event_name == 'push' && vars.MACOS_SIGNING != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUACKO_BUILD_GITHUB_CLIENT_ID: ${{ vars.QUACKO_GITHUB_CLIENT_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: --target universal-apple-darwin

      - name: Build e release (assinado e notarizado)
        if: github.event_name == 'push' && vars.MACOS_SIGNING == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUACKO_BUILD_GITHUB_CLIENT_ID: ${{ vars.QUACKO_GITHUB_CLIENT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          args: --target universal-apple-darwin

      - name: Cópia com nome fixo (botão de download do README)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          test -n "$RELEASE_ID" || { echo "::error::sem o id do rascunho"; exit 1; }
          file=$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          curl -fsS -X POST -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$file" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=Quacko_universal.dmg"

      - name: Build (sem release)
        if: github.event_name != 'push'
        run: npx tauri build --target universal-apple-darwin

      - name: Guardar o .dmg
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quacko-macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    needs: draft
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    runs-on: windows-latest
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> ../target"

      - run: npm ci

      - name: Versão da release
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: node .github/release/set-version.mjs "$VERSION"

      - name: Hook (quacko-hook.exe, empacotado junto do app)
        run: |
          cargo build --release -p quacko-hook --manifest-path src-tauri/Cargo.toml
          mkdir -p src-tauri/binaries
          cp "$CARGO_TARGET_DIR/release/quacko-hook.exe" src-tauri/binaries/quacko-hook-x86_64-pc-windows-msvc.exe

      - name: Testes
        run: |
          npm test
          npx tsc --noEmit
          cargo test --workspace --no-fail-fast --manifest-path src-tauri/Cargo.toml
          QUACKO_NOTIFY="$CARGO_TARGET_DIR/release/quacko-hook.exe" bash scripts/tests/notify.test.sh
          pwsh -NoProfile -File scripts/tests/shell.test.ps1

      - name: Build e release
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUACKO_BUILD_GITHUB_CLIENT_ID: ${{ vars.QUACKO_GITHUB_CLIENT_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.id }}

      - name: Cópia com nome fixo (botão de download do README)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          test -n "$RELEASE_ID" || { echo "::error::sem o id do rascunho"; exit 1; }
          file=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          curl -fsS -X POST -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$file" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=Quacko_x64-setup.exe"

      - name: Build (sem release)
        if: github.event_name != 'push'
        run: npx tauri build

      - name: Guardar o instalador
        if: github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quacko-windows
          path: target/release/bundle/nsis/*.exe

  publish:
    needs: [draft, macos, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Publica a release (cria a tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --jq '"publicada: \(.html_url)"'

  homebrew:
    needs: [draft, publish]
    if: vars.HOMEBREW_TAP == 'true'
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ needs.draft.outputs.tag }}
    secrets: inherit
