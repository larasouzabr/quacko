name: Feature request
description: An idea to make Quacko better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or problem, more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Quacko help?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
