[package]
name = "quacko-hook"
version = "0.1.0"
description = "Hook do Quacko para Claude Code e Cursor"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "quacko_hook"
path = "src/lib.rs"

[[bin]]
name = "quacko-hook"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_WinRT"] }

[dev-dependencies]
tempfile = "3"
