[package]
name = "quacko"
version = "0.1.0"
description = "Notificador desktop com patinho"
edition = "2021"

[workspace]
members = ["hook"]

[lib]
name = "quacko_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "form"] }
tokio = { version = "1", features = ["net", "rt", "sync", "macros", "time"] }
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
dirs = "7"
sys-locale = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
keyring = { version = "3", features = ["apple-native"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
quacko-hook = { path = "hook" }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace", "NSWindow", "NSResponder", "NSGraphics", "libc", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSGeometry"] }
plist = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }
